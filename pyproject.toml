[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "residual-worlds"
version = "0.1.0"
description = "Residual dynamics learning and model-predictive control on a two-link arm across controlled simulated worlds"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "gymnasium==1.3.0",
  "pyyaml",
  "pyarrow",
  "matplotlib",
  "pillow",
  "safetensors",
  "tqdm",
  "rfc8785",
]

[project.optional-dependencies]
cpu = ["torch==2.12.*"]
cu130 = ["torch==2.12.*"]

[project.scripts]
residual-worlds = "residual_worlds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/residual_worlds"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "slow: long-running tests excluded from the default suite",
  "gpu: tests requiring a CUDA device",
  "protected: tests that touch protected-evaluation machinery",
  "scientific: release-blocking scientific validity tests",
]

[tool.ruff]
extend-exclude = ["parked"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["src/residual_worlds"]
